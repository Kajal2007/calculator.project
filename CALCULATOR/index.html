<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Mini Project</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- Header with title and theme toggle -->
    <header class="app-header">
      <h1>Calculator</h1>
      <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Dark/Light Mode">🌙</button>
    </header>

    <div class="main-content">

      <!-- Calculator Section -->
      <div class="calculator">

        <!-- Display Screen -->
        <div class="display">
          <div id="previous-operand" class="previous-operand"></div>
          <div id="current-operand" class="current-operand">0</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
          <button class="btn function-btn" data-action="clear">C</button>
          <button class="btn function-btn" data-action="backspace">⌫</button>
          <button class="btn function-btn" data-action="sign">+/-</button>
          <button class="btn operator-btn" data-action="operator" data-value="÷">÷</button>

          <button class="btn number-btn" data-number="7">7</button>
          <button class="btn number-btn" data-number="8">8</button>
          <button class="btn number-btn" data-number="9">9</button>
          <button class="btn operator-btn" data-action="operator" data-value="×">×</button>

          <button class="btn number-btn" data-number="4">4</button>
          <button class="btn number-btn" data-number="5">5</button>
          <button class="btn number-btn" data-number="6">6</button>
          <button class="btn operator-btn" data-action="operator" data-value="-">-</button>

          <button class="btn number-btn" data-number="1">1</button>
          <button class="btn number-btn" data-number="2">2</button>
          <button class="btn number-btn" data-number="3">3</button>
          <button class="btn operator-btn" data-action="operator" data-value="+">+</button>

          <button class="btn function-btn" data-action="percent">%</button>
          <button class="btn number-btn" data-number="0">0</button>
          <button class="btn number-btn" data-action="decimal">.</button>
          <button class="btn equals-btn" data-action="equals">=</button>
        </div>
      </div>

      <!-- History Section -->
      <div class="history-panel">
        <div class="history-header">
          <h2>History</h2>
          <button id="clear-history-btn" class="clear-history-btn">Clear History</button>
        </div>
        <ul id="history-list" class="history-list">
          <!-- History items will be added here by JavaScript -->
        </ul>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
